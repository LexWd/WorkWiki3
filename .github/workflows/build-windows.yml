name: Build Windows Executables & Deploy to Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install
          npm install --no-save @rollup/rollup-win32-x64-msvc

      - name: Build Web Assets & Windows Setup EXE
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy Setup EXE to dist for GitHub Pages
        shell: bash
        run: |
          mkdir -p dist
          cp release/WorkWiki-3-Setup-*.exe dist/WorkWiki-3-Setup.exe || true
          cp release/WorkWiki-3-Setup-*.exe dist/ || true

      - name: Upload Windows Executables to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: WorkWiki-3-Windows-x64
          path: |
            release/*.exe
          retention-days: 30

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
